name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Temporary debug step: remove once deploy works
      - name: Debug connectivity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PORT" ]; then
            echo "::error::DEPLOY_HOST or DEPLOY_PORT secret is EMPTY"
            exit 1
          fi
          echo "Testing TCP connection to host:port ..."
          nc -vz -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT" \
            && echo "TCP connection OK" \
            || { echo "::error::TCP connection FAILED (timeout or refused)"; exit 1; }

      - name: Deploy backend & frontend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            cd /root/soul_connect
            git fetch origin main
            git reset --hard origin/main

            docker build -t soulconnect-backend:latest ./SoulConnect_BACK_END
            docker stop soulconnect-backend || true
            docker rm soulconnect-backend || true
            docker run -d \
              --name soulconnect-backend \
              --restart unless-stopped \
              --env-file ./SoulConnect_BACK_END/.env \
              -p 3000:3000 \
              -v soulconnect-backend-uploads:/app/uploads \
              --add-host=host.docker.internal:host-gateway \
              soulconnect-backend:latest

            docker build -t soulconnect-frontend:latest ./SoulConnect_FRONT_END_Next
            docker stop soulconnect-frontend || true
            docker rm soulconnect-frontend || true
            docker run -d \
              --name soulconnect-frontend \
              --restart unless-stopped \
              -p 8080:80 \
              soulconnect-frontend:latest

            docker image prune -f

      - name: Check if soul_theme changed
        id: theme_check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^soul_theme/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy Keycloak theme to server
        if: steps.theme_check.outputs.changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          source: "soul_theme/login/*"
          target: "/opt/keycloak/themes/soul_theme/login"
          strip_components: 2
          overwrite: true

      - name: Restart Keycloak (theme picked up)
        if: steps.theme_check.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          script: |
            systemctl restart keycloak || docker restart keycloak || true
